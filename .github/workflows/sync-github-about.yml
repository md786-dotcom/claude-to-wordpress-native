name: Sync GitHub About

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/sync-github-about.yml

permissions: read-all

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      administration: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Sync description, homepage, and topics from package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(jq -r '.name' package.json)"
          DESCRIPTION="$(jq -r '.description' package.json)"
          HOMEPAGE="https://www.npmjs.com/package/${NAME}"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="$DESCRIPTION" \
            -f homepage="$HOMEPAGE"
          TOPICS_JSON="$(jq -c '.keywords' package.json)"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" \
            --input - <<< "{\"names\": ${TOPICS_JSON}}"
