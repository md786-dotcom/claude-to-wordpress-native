name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm CLI 11.5.1+
        run: npm install -g npm@latest
      - name: Remove empty setup-node auth token so OIDC can run
        run: sed -i '/^\/\/registry.npmjs.org\/:_authToken=/d' "${HOME}/.npmrc" || true
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish with trusted publishing (automatic provenance)
        run: npm publish --access public
