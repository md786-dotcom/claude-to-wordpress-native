name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm CLI 11.5.1+
        run: npm install -g npm@latest
      - name: Remove empty setup-node auth token so OIDC can run
        run: sed -i '/^\/\/registry.npmjs.org\/:_authToken=/d' "${HOME}/.npmrc" || true
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish with trusted publishing (automatic provenance)
        run: npm publish --access public
