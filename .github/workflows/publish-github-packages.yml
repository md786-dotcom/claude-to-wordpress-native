name: Publish GitHub Packages mirror

# Backfill or re-sync npm package to GitHub Packages so the repo Packages sidebar is populated.
# npmjs.org publishes do not appear there; GitHub Packages (npm.pkg.github.com) does.
# GitHub Packages requires a scoped name: @owner/claude-to-wordpress-native

on:
  workflow_dispatch:

permissions: read-all

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install npm 11.6.2
        run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-github-packages.sh
