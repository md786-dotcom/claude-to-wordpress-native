name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx knip --include files,dependencies,unlisted

  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse includes --level=5 || true
      - run: vendor/bin/phpmd includes text cleancode,codesize,unusedcode || true
