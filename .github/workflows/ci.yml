name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

permissions: read-all

jobs:
  typescript:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install npm 11.6.2
        run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx knip --include files,dependencies,unlisted

  php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer install --no-interaction
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse includes --level=5 || true
      - run: vendor/bin/phpmd includes text cleancode,codesize,unusedcode || true
